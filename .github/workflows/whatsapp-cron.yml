name: WhatsApp Vencimentos - Cron GitHub

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar envio mesmo fora do horário (para teste)'
        required: false
        default: 'true'
        type: choice
        options: ['true','false']

jobs:
  verificar-e-enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Verificar vencimentos e enviar WhatsApp
        timeout-minutes: 4
        env:
          FIREBASE_DATABASE_URL: "https://controle-financeiro-e4f3b-default-rtdb.firebaseio.com"
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_SEND: ${{ inputs.force || 'false' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "🔍 Evento: $GITHUB_EVENT_NAME, Force: $FORCE_SEND"
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "❌ Secret FIREBASE_SERVICE_ACCOUNT não configurado!"
            exit 1
          fi
          echo "📦 Instalando..."
          npm install firebase-admin@12 node-fetch@2 --no-audit --no-fund --loglevel=error
          echo "🚀 Iniciando..."
          node << 'NODE'
          const admin = require('firebase-admin');
          const fetch = require('node-fetch');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          admin.initializeApp({ credential: admin.credential.cert(sa), databaseURL: process.env.FIREBASE_DATABASE_URL });
          const db = admin.database();
          function diffDias(d){
            if(!d||!d.includes("-")) return 9999;
            const p=d.split("-").map(Number);
            const dt=new Date(p[0],p[1]-1,p[2]); dt.setHours(0,0,0,0);
            const hoje=new Date(); hoje.setHours(0,0,0,0);
            return Math.floor((dt-hoje)/86400000);
          }
          async function enviarWhatsApp(tel, apikey, msg){
            const url=`https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent(tel)}&text=${encodeURIComponent(msg)}&apikey=${encodeURIComponent(apikey)}`;
            console.log(`📱 Enviando para ${tel} - ${msg.slice(0,80)}...`);
            try{
              const r=await fetch(url, { timeout: 15000 });
              const t=await r.text();
              console.log("Resposta CallMeBot:", t.slice(0,500));
              return t.toLowerCase().includes("message") || r.ok;
            }catch(e){ console.error("Erro:", e.message); return false; }
          }
          (async()=>{
            const snap=await db.ref("usuarios").once("value");
            if(!snap.exists()){ console.log("Sem usuários"); return; }
            const usuarios=snap.val();
            console.log(`👥 Total usuários: ${Object.keys(usuarios).length}`);
            const agora=new Date();
            const sp=new Date(agora.getTime()-3*60*60*1000);
            const hojeISO=agora.toISOString().slice(0,10);
            const spStr=String(sp.getHours()).padStart(2,"0")+":"+String(sp.getMinutes()).padStart(2,"0");
            const isManual = process.env.GITHUB_EVENT_NAME === "workflow_dispatch";
            const force = process.env.FORCE_SEND === "true" || isManual;
            console.log(`⏰ Hora SP: ${spStr}, Hoje: ${hojeISO}, Manual: ${isManual}, Force: ${force}`);
            
            for(const uid of Object.keys(usuarios)){
              const user=usuarios[uid];
              const config=user.configNotificacao;
              const resumo=user.dadosResumo;
              if(!config){ console.log(`⏭️ ${uid}: sem config`); continue; }
              if(!resumo){ console.log(`⏭️ ${uid}: sem dadosResumo - abra o app v11.2+ e faça login`); continue; }
              const horario=config.horario||"08:00";
              const dias=Number(config.diasAntecedencia)||1;
              const tel=config.whatsappTelefone;
              const apikey=config.whatsappApikey;
              if(!config.whatsappAtivo||!tel||!apikey){ console.log(`⏭️ ${uid}: WhatsApp não configurado`); continue; }
              
              const [hC,mC]=horario.split(":").map(Number);
              const diffMin=Math.abs((sp.getHours()*60+sp.getMinutes())-(hC*60+mC));
              console.log(`🔍 ${uid}: config ${horario}, dias ${dias}, diffMin ${diffMin}, tel ${tel.slice(0,4)}****`);
              
              if(!force && diffMin>14){
                console.log(`  ⏭️ Fora da janela de 15min do horário ${horario}, pulando (mas como é teste manual, forçando)`);
                if(!isManual) continue;
              }
              
              const chave=`wpp_github_${hojeISO}_${horario}`;
              if(!force){
                const ja=await db.ref(`usuarios/${uid}/historicoPush/${chave}`).once("value");
                if(ja.exists()){ console.log(`  ⏭️ Já enviado hoje ${horario}`); continue; }
              }
              
              const vencs=(resumo.pendentes||[]).map(it=>{
                const diff=diffDias(it.data);
                let tipo=""; if(diff<0) tipo="vencida"; else if(diff===0) tipo="hoje"; else if(diff>0&&diff<=dias) tipo="proxima";
                return {...it,diff,tipo};
              }).filter(x=>x.tipo!=="");
              
              console.log(`  Vencimentos nos próximos ${dias}d: ${vencs.length}`);
              if(vencs.length===0){ console.log("  Nenhum para enviar"); continue; }
              
              let msg=`💰 Controle Financeiro - ${sp.toLocaleString("pt-BR")}\n\n`;
              vencs.forEach(v=>{ msg+=`• ${v.descricao} - R$${v.valor} - ${v.data} (${v.tipo} ${v.diff}d)\n`; });
              msg+=`\nTotal: R$${vencs.reduce((s,v)=>s+Number(v.valor||0),0)}\nhttps://furlaneto1995.github.io/controle_financeiro/`;
              
              const ok=await enviarWhatsApp(tel,apikey,msg);
              console.log(`${uid}: ${ok?"✅ ENVIADO":"❌ FALHA"}`);
              if(ok && !force){
                await db.ref(`usuarios/${uid}/historicoPush/${chave}`).set({enviadoEm:new Date().toISOString(), via:"github-actions"});
              }
            }
            console.log("✅ Fim");
          })();
          NODE
