name: WhatsApp Vencimentos - Cron GitHub

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  verificar-e-enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Verificar vencimentos e enviar WhatsApp
        timeout-minutes: 4
        env:
          FIREBASE_DATABASE_URL: "https://controle-financeiro-e4f3b-default-rtdb.firebaseio.com"
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "🔍 Verificando secrets..."
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "❌ ERRO: Secret FIREBASE_SERVICE_ACCOUNT não configurado!"
            exit 1
          fi
          echo "✅ Secret encontrado"
          echo "📦 Instalando dependências..."
          npm install firebase-admin@12 node-fetch@2 --no-audit --no-fund
          echo "✅ Instalado"
          echo "🚀 Iniciando verificação..."
          node << 'NODE'
          const admin = require('firebase-admin');
          const fetch = require('node-fetch');
          let sa;
          try{
            sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
            console.log("✅ Service Account projeto:", sa.project_id);
          }catch(e){ console.error("❌ JSON inválido", e.message); process.exit(1); }
          admin.initializeApp({ credential: admin.credential.cert(sa), databaseURL: process.env.FIREBASE_DATABASE_URL });
          const db = admin.database();
          function diffDias(d){
            if(!d||!d.includes("-")) return 9999;
            const p=d.split("-").map(Number);
            const dt=new Date(p[0],p[1]-1,p[2]); dt.setHours(0,0,0,0);
            const hoje=new Date(); hoje.setHours(0,0,0,0);
            return Math.floor((dt-hoje)/86400000);
          }
          async function enviarWhatsApp(tel, apikey, msg){
            const url=`https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent(tel)}&text=${encodeURIComponent(msg)}&apikey=${encodeURIComponent(apikey)}`;
            console.log(`📱 Enviando para ${tel}...`);
            try{
              const controller=new AbortController();
              const to=setTimeout(()=>controller.abort(),15000);
              const r=await fetch(url,{signal:controller.signal});
              clearTimeout(to);
              const t=await r.text();
              console.log("Resposta:", t.slice(0,300));
              return r.ok;
            }catch(e){ console.error("Erro:", e.message); return false; }
          }
          (async()=>{
            const snap=await db.ref("usuarios").once("value");
            if(!snap.exists()){ console.log("Sem usuários"); return; }
            console.log(`Total usuários: ${Object.keys(snap.val()).length}`);
            const agora=new Date();
            const sp=new Date(agora.getTime()-3*60*60*1000);
            const hojeISO=agora.toISOString().slice(0,10);
            const spStr=String(sp.getHours()).padStart(2,"0")+":"+String(sp.getMinutes()).padStart(2,"0");
            console.log(`Hora SP: ${spStr}`);
            let enviados=0;
            for(const uid of Object.keys(snap.val())){
              const user=snap.val()[uid];
              const config=user.configNotificacao;
              const resumo=user.dadosResumo;
              if(!config||!resumo){ console.log(`${uid}: sem config ou resumo`); continue; }
              const horario=config.horario||"08:00";
              const dias=Number(config.diasAntecedencia)||1;
              const tel=config.whatsappTelefone;
              const apikey=config.whatsappApikey;
              if(!config.whatsappAtivo||!tel||!apikey){ console.log(`${uid}: wpp não configurado`); continue; }
              const [hC,mC]=horario.split(":").map(Number);
              if(Math.abs((sp.getHours()*60+sp.getMinutes())-(hC*60+mC))>14){ console.log(`${uid}: fora janela ${horario}`); continue; }
              const chave=`wpp_github_${hojeISO}_${horario}`;
              const ja=await db.ref(`usuarios/${uid}/historicoPush/${chave}`).once("value");
              if(ja.exists()){ console.log(`${uid}: já enviado hoje`); continue; }
              const vencs=(resumo.pendentes||[]).map(it=>{
                const diff=diffDias(it.data);
                let tipo=""; if(diff<0) tipo="vencida"; else if(diff===0) tipo="hoje"; else if(diff>0&&diff<=dias) tipo="proxima";
                return {...it,diff,tipo};
              }).filter(x=>x.tipo!=="");
              console.log(`${uid}: ${vencs.length} vencimentos`);
              if(vencs.length===0) continue;
              let msg=`💰 Controle Financeiro - ${sp.toLocaleString("pt-BR")}\n\n`+vencs.map(v=>`• ${v.descricao} - R$${v.valor} - ${v.data} (${v.tipo})`).join("\n");
              const ok=await enviarWhatsApp(tel,apikey,msg);
              console.log(`${uid}: ${ok?"✅ OK":"❌ FALHA"}`);
              if(ok){ await db.ref(`usuarios/${uid}/historicoPush/${chave}`).set({enviadoEm:new Date().toISOString()}); enviados++; }
            }
            console.log(`Fim: enviados=${enviados}`);
          })();
          NODE
          echo "✅ Finalizado"
