# ============================================================
#  Controle Financeiro - Aviso diario de vencimentos
#  Envia WhatsApp (CallMeBot) e Push (FCM) 1x por dia.
#
#  Horario do disparo (Brasil / America/Sao_Paulo = UTC-3):
#    08:00 BRT -> cron '0 11 * * *'   <-- atual
#    12:00 BRT -> cron '0 15 * * *'
#    18:00 BRT -> cron '0 21 * * *'
#    20:00 BRT -> cron '0 23 * * *'
#  Troque a linha "cron:" abaixo se quiser outro horario.
# ============================================================
name: Aviso diario de vencimentos

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forcar envio agora (teste)'
        required: false
        default: 'false'
        type: boolean

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enviar avisos de vencimento
        timeout-minutes: 7
        continue-on-error: true
        env:
          FIREBASE_DATABASE_URL: "https://controle-financeiro-e4f3b-default-rtdb.firebaseio.com"
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_SEND: ${{ inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          npm install firebase-admin@12 node-fetch@2 --no-audit --no-fund --loglevel=error
          node << 'NODE'
          const admin = require('firebase-admin');
          const fetch = require('node-fetch');

          const TZ = 'America/Sao_Paulo';
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          admin.initializeApp({ credential: admin.credential.cert(sa), databaseURL: process.env.FIREBASE_DATABASE_URL });
          const db = admin.database();
          const messaging = admin.messaging();

          const forcar = process.env.EVENT_NAME === 'workflow_dispatch' && process.env.FORCE_SEND === 'true';

          function agoraBR(){
            const f = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23' });
            const p = Object.fromEntries(f.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
            return { data: `${p.year}-${p.month}-${p.day}`, hora: Number(p.hour), minuto: Number(p.minute) };
          }
          function numeroData(d){
            if(!/^\d{4}-\d{2}-\d{2}$/.test(String(d||''))) return null;
            const [a,m,dd] = String(d).split('-').map(Number);
            return Date.UTC(a, m-1, dd);
          }
          function diffDias(data, hoje){
            const a = numeroData(data), b = numeroData(hoje);
            return (a===null||b===null) ? 9999 : Math.round((a-b)/86400000);
          }
          function dinheiro(v){ return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
          function dataBR(d){ const p=String(d||'').split('-'); return p.length===3 ? `${p[2]}/${p[1]}/${p[0]}` : d; }

          async function enviarWhatsApp(tel, apikey, msg){
            const url = `https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent(tel)}&text=${encodeURIComponent(msg)}&apikey=${encodeURIComponent(apikey)}`;
            try{
              const r = await fetch(url);
              const t = await r.text();
              const ok = /queued|message/i.test(t);
              console.log(`    CallMeBot: ${ok ? 'OK (mensagem na fila)' : t.slice(0,120)}`);
              return ok;
            }catch(e){ console.log(`    CallMeBot falhou: ${e.message}`); return false; }
          }

          function montarTexto(venc, dias){
            const vencidas = venc.filter(v=>v.diff<0);
            const hoje = venc.filter(v=>v.diff===0);
            const prox = venc.filter(v=>v.diff>0);
            let m = `💰 *Controle Financeiro*\n\n`;
            if(vencidas.length){
              m += `🚨 *VENCIDA${vencidas.length>1?'S':''} (${vencidas.length}):*\n`;
              vencidas.forEach(v=>{ m += `• ${v.descricao} - ${dinheiro(v.valor)} - venceu ${dataBR(v.data)}\n`; });
              m += `\n`;
            }
            if(hoje.length){
              m += `⚠️ *VENCE HOJE (${hoje.length}):*\n`;
              hoje.forEach(v=>{ m += `• ${v.descricao} - ${dinheiro(v.valor)}\n`; });
              m += `\n`;
            }
            if(prox.length){
              m += `⏰ *A VENCER em até ${dias} dia${dias>1?'s':''} (${prox.length}):*\n`;
              prox.forEach(v=>{ m += `• ${v.descricao} - ${dinheiro(v.valor)} - ${dataBR(v.data)}\n`; });
              m += `\n`;
            }
            const total = venc.reduce((s,v)=>s+Number(v.valor||0),0);
            m += `💵 *Total:* ${dinheiro(total)}\n\n👉 https://furlaneto1995.github.io/controle_financeiro/`;
            return m;
          }

          function tokensAndroid(fcmTokens){
            const vistos = new Set();
            return Object.values(fcmTokens||{})
              .map(v => typeof v==='string' ? {token:v, plataforma:'pc', criadoEm:''} : v)
              .filter(t => t && t.token)
              .filter(t => {
                const g = `${t.plataforma||'pc'}|${t.userAgent||t.token}`;
                if(vistos.has(g)) return false;
                vistos.add(g);
                return true;
              });
          }

          (async ()=>{
            const agora = agoraBR();
            console.log(`Horario Brasil: ${agora.data} ${String(agora.hora).padStart(2,'0')}:${String(agora.minuto).padStart(2,'0')} | Forcar: ${forcar}`);

            const snap = await db.ref('usuarios').once('value');
            const usuarios = snap.val() || {};
            console.log(`Usuarios cadastrados: ${Object.keys(usuarios).length}`);

            let ok = 0;

            for(const [uid, u] of Object.entries(usuarios)){
              try{
                const cfg = u.configNotificacao;
                const resumo = u.dadosResumo;
                if(!cfg){ console.log(`${uid}: sem configNotificacao (entre no app com este usuario)`); continue; }
                if(!resumo || !Array.isArray(resumo.pendentes)){ console.log(`${uid}: sem dadosResumo (abra o app v12.2 e faca login)`); continue; }

                const dias = Math.max(1, Math.min(30, Number(cfg.diasAntecedencia) || 1));
                const venc = resumo.pendentes
                  .map(i => ({ ...i, diff: diffDias(i.data, agora.data) }))
                  .filter(v => v.diff <= dias)
                  .sort((a,b)=>a.diff-b.diff);

                console.log(`${uid}: horario ${cfg.horario||'08:00'} | antecedencia ${dias}d | pendentes ${resumo.pendentes.length} | dentro da janela: ${venc.length}`);

                if(venc.length === 0){ console.log(`  nada a vencer, sem envio`); continue; }

                const chave = `aviso_${agora.data}`;
                const jaRef = db.ref(`usuarios/${uid}/historicoPush/${chave}`);
                if(!forcar){
                  const ja = await jaRef.once('value');
                  if(ja.exists()){ console.log(`  ja avisado hoje`); continue; }
                }

                const texto = montarTexto(venc, dias);

                // WhatsApp
                if(cfg.whatsappAtivo && cfg.whatsappTelefone && cfg.whatsappApikey){
                  const enviou = await enviarWhatsApp(cfg.whatsappTelefone, cfg.whatsappApikey, texto);
                  if(enviou) ok++;
                } else {
                  console.log(`  WhatsApp desativado ou sem telefone/apikey`);
                }

                // Push (se houver token)
                const tokens = tokensAndroid(u.fcmTokens).map(t=>t.token);
                if(cfg.pushAtivo !== false && tokens.length){
                  try{
                    const r = await messaging.sendEachForMulticast({
                      tokens,
                      notification: { title: 'Controle Financeiro - Vencimentos', body: texto.split('\n').slice(2,5).join('\n').slice(0,180) },
                      data: { url: 'https://furlaneto1995.github.io/controle_financeiro/' }
                    });
                    console.log(`  Push: ${r.successCount} ok, ${r.failureCount} falha`);
                    if(r.successCount > 0) ok++;
                  }catch(e){ console.log(`  Push falhou: ${e.message}`); }
                }

                if(!forcar) await jaRef.set({ enviadoEm: new Date().toISOString(), contas: venc.length });
              }catch(e){
                console.log(`${uid}: erro isolado -> ${e.message}`);
              }
            }

            console.log(`Fim. Envios com sucesso: ${ok}`);
            try{ await admin.app().delete(); }catch(e){}
            process.exit(0);
          })().catch(async e => {
            console.log('Erro geral (ignorado para nao gerar alerta): ' + e.message);
            try{ await admin.app().delete(); }catch(x){}
            process.exit(0);
          });
          NODE
