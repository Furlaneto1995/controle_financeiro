name: WhatsApp Vencimentos

on:
  schedule:
    - cron: '*/15 * * * *'  # Verifica a cada 15 min
  workflow_dispatch:
    inputs:
      force:
        description: 'Forçar envio agora (ignora horário) - para teste'
        required: false
        default: 'false'
        type: boolean

jobs:
  verificar-e-enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enviar WhatsApp se tiver vencimentos
        timeout-minutes: 4
        env:
          FIREBASE_DATABASE_URL: "https://controle-financeiro-e4f3b-default-rtdb.firebaseio.com"
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_SEND: ${{ inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          npm install firebase-admin@12 node-fetch@2 --no-audit --no-fund --loglevel=error
          node << 'NODE'
          const admin = require('firebase-admin');
          const fetch = require('node-fetch');
          const sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          admin.initializeApp({ credential: admin.credential.cert(sa), databaseURL: process.env.FIREBASE_DATABASE_URL });
          const db = admin.database();
          function diffDias(d){
            if(!d||!d.includes("-")) return 9999;
            const p=d.split("-").map(Number);
            const dt=new Date(p[0],p[1]-1,p[2]); dt.setHours(0,0,0,0);
            const hoje=new Date(); hoje.setHours(0,0,0,0);
            return Math.floor((dt-hoje)/86400000);
          }
          async function enviarWhatsApp(tel, apikey, msg){
            const url=`https://api.callmebot.com/whatsapp.php?phone=${encodeURIComponent(tel)}&text=${encodeURIComponent(msg)}&apikey=${encodeURIComponent(apikey)}`;
            try{
              const r=await fetch(url);
              const t=await r.text();
              console.log("CallMeBot:", t.slice(0,200));
              return r.ok;
            }catch(e){ console.error(e.message); return false; }
          }
          (async()=>{
            const snap=await db.ref("usuarios").once("value");
            if(!snap.exists()){ console.log("Sem usuários"); return; }
            const agora=new Date();
            const sp=new Date(agora.getTime()-3*60*60*1000);
            const hojeISO=agora.toISOString().slice(0,10);
            const spMin=sp.getHours()*60+sp.getMinutes();
            const isManual=process.env.EVENT_NAME==="workflow_dispatch";
            const force=process.env.FORCE_SEND==="true" || isManual;
            console.log(`Hora SP: ${String(sp.getHours()).padStart(2,"0")}:${String(sp.getMinutes()).padStart(2,"0")} - Force: ${force}`);
            
            for(const uid of Object.keys(snap.val())){
              const user=snap.val()[uid];
              const cfg=user.configNotificacao;
              const resumo=user.dadosResumo;
              if(!cfg||!resumo) continue;
              if(!cfg.whatsappAtivo||!cfg.whatsappTelefone||!cfg.whatsappApikey) continue;
              
              const [hC,mC]= (cfg.horario||"08:00").split(":").map(Number);
              const diffMin=Math.abs(spMin - (hC*60+mC));
              if(!force && diffMin>14) continue; // só no horário configurado, exceto quando forçar manual
              
              const chave=`wpp_${hojeISO}_${cfg.horario}`;
              if(!force){
                const ja=await db.ref(`usuarios/${uid}/historicoPush/${chave}`).once("value");
                if(ja.exists()) continue;
              }
              
              const vencs=(resumo.pendentes||[]).map(it=>{
                const diff=diffDias(it.data);
                let tipo=""; if(diff<0) tipo="vencida"; else if(diff===0) tipo="hoje"; else if(diff>0&&diff<=Number(cfg.diasAntecedencia||1)) tipo="proxima";
                return {...it,diff,tipo};
              }).filter(x=>x.tipo!=="");
              
              if(vencs.length===0) continue;
              
              let msg=`💰 Controle Financeiro - ${sp.toLocaleString("pt-BR")}\n\n`;
              vencs.forEach(v=>{ msg+=`• ${v.descricao} - R$${v.valor} - ${v.data} (${v.tipo})\n`; });
              msg+=`\nTotal: R$${vencs.reduce((s,v)=>s+Number(v.valor||0),0)}`;
              
              const ok=await enviarWhatsApp(cfg.whatsappTelefone, cfg.whatsappApikey, msg);
              console.log(`${uid}: ${ok?"✅ Enviado":"❌ Falha"}`);
              if(ok) await db.ref(`usuarios/${uid}/historicoPush/${chave}`).set({enviadoEm:new Date().toISOString()});
            }
            console.log("Fim");
            process.exit(0);
          })();
          NODE
